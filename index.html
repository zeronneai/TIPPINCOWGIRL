<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tippin' Cowgirl · Custom Cowboy Hats, Built by You</title>
    <meta
      name="description"
      content="Design your own custom cowboy hat: pick your base, stack feathers, cords and florals, and make it unmistakably yours. Order online with shipping across the US, or visit the hat bar at The Shoppes at Solana in El Paso, TX."
    />

    <!-- The custom domain is live. Every URL below is absolute and points at
         tippincowgirl.com: relative paths are not resolved by most link
         preview crawlers, so og:image and twitter:image in particular have
         to carry the full origin. Keep these in sync with
         public/sitemap.xml and the Sitemap line in public/robots.txt.

         NO rel="canonical" HERE ON PURPOSE. This one file serves every path
         (/, /faq, /terms...), so a static canonical would tell Google that
         /faq is a copy of the home page. src/router.js sets exactly one
         canonical per page instead, which Google reads when it renders. -->

    <!-- Open Graph: what IG bios / WhatsApp / iMessage show when the link is shared -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tippin Cowgirl" />
    <meta property="og:title" content="Tippin' Cowgirl · Custom Cowboy Hats, Built by You" />
    <meta
      property="og:description"
      content="Design your own custom cowboy hat online or at the hat bar. Feathers, cords, florals and engraving, made unmistakably yours. Plus pop-ups and private events."
    />
    <meta property="og:url" content="https://tippincowgirl.com/" />
    <meta property="og:image" content="https://tippincowgirl.com/logo.png" />
    <meta property="og:image:alt" content="Tippin' Cowgirl, custom cowboy hats built by you" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tippin' Cowgirl · Custom Cowboy Hats, Built by You" />
    <meta
      name="twitter:description"
      content="Design your own custom cowboy hat online or at the hat bar. Pop-ups and private events too."
    />
    <meta name="twitter:image" content="https://tippincowgirl.com/logo.png" />

    <meta name="theme-color" content="#e8674a" />
    <!-- Icons: the rider from public/logo.png on the logo's brown (the
         wordmark is too fine for a browser tab). The whole set, /admin
         included, since every path is served by this file. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet" />

        "image": "https://tippincowgirl.com/logo.png",
